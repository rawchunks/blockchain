[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "script/" }]

# Remappings
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@thirdweb-dev/contracts/=lib/contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# RPC Endpoints
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC}"
base_mainnet = "${BASE_MAINNET_RPC}"
tempo_mainnet = "${TEMPO_MAINNET_RPC}"
tempo_moderato = "${TEMPO_MODERATO_RPC}"

# Formatter
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"

# Testing
[fuzz]
runs = 256
max_test_rejects = 65536

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options